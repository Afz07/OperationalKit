# Local PostgreSQL for development.
#   docker compose up -d      # start the database in the background
#   docker compose down       # stop it (data is kept in the named volume)
#   docker compose down -v    # stop it and delete all data
#
# Matches the DATABASE_URL suggested in .env.example:
#   postgresql://operationalkit:operationalkit@localhost:5432/operationalkit

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: operationalkit
      POSTGRES_PASSWORD: operationalkit
      POSTGRES_DB: operationalkit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operationalkit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
